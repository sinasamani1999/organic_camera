seed: 0
out_dir: runs/synthetic

data:
  kind: synthetic        # 'phone' from week 2
  num_samples: 512
  seq_len: 10
  val_fraction: 0.2

model:
  hidden_dim: 128
  num_heads: 4
  pretrained: true
  freeze_backbone: true
  use_visual: true
  use_attention: true

loss:
  alpha: 1.0
  beta: 0.6
  gamma: 0.4
  min_norm: 0.1

train:
  batch_size: 16
  lr: 0.001
  epochs: 20
  workers: 0             # keep 0 on Windows until the real dataset exists
